name: Driver Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Driver Pro
        run: |
          set -e

          ZIP="DriverPro_V3.7.1_Auto_Rotation.zip"

          test -f "$ZIP" || {
            echo "ERROR: Driver Pro ZIP missing"
            exit 1
          }

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully"

      - name: Locate Android project
        run: |
          set -e

          PROJECT=$(find extracted -type f \
            -name settings.gradle -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          PROJECT="${PROJECT%/settings.gradle}"

          test -f "$PROJECT/app/build.gradle" || {
            echo "ERROR: app/build.gradle missing"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-V3.7.1-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
