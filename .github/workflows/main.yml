name: Build Driver Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Driver Pro project
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'DriverPro_V3.6.6_Comprehensive_Review.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Driver Pro ZIP file not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/driverpro"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/driverpro"

          echo "Extraction completed."

      - name: Locate Android project
        run: |
          set -e

          ROOT="$RUNNER_TEMP/driverpro"

          WRAPPER=$(find "$ROOT" -type f \
            -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT/settings.gradle" ] && \
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build Driver Pro APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          set -e

          mkdir -p output

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not generated."
            exit 1
          fi

          cp "$APK" output/Driver-Pro.apk

      - name: Upload Driver Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-APK
          path: output/Driver-Pro.apk
          if-no-files-found: error
